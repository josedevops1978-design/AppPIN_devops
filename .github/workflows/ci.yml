name: CI Backend

# Disparo temporalmente limitado a manual (workflow_dispatch) mientras se
# ajusta el pipeline, para no consumir minutos de GitHub Actions en cada push.
# Para volver a activarlo automaticamente, descomentar el bloque "push"/"pull_request".
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

jobs:

  # -------------------------------------------------------------------------
  # BUILD: instala dependencias, lintea, construye las imagenes Docker y
  # valida/planifica la infraestructura de Terraform.
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gestion-usuarios-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gestion-usuarios-frontend:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
          TF_VAR_mysql_password: ${{ secrets.MYSQL_PASSWORD }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_mysql_user: ${{ secrets.MYSQL_USER }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  # -------------------------------------------------------------------------
  # TEST: corre la suite de tests con cobertura y el analisis de
  # vulnerabilidades de dependencias.
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm test

      - name: Security scan with Snyk
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=backend/package.json --severity-threshold=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  # -------------------------------------------------------------------------
  # SONARQUBE: analisis estatico de calidad y seguridad de codigo.
  # -------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # -------------------------------------------------------------------------
  # SBOM: genera el listado de dependencias (Software Bill of Materials)
  # del backend y del frontend en formato CycloneDX.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json

  # -------------------------------------------------------------------------
  # DEPLOY: aplica el plan de Terraform en el self-hosted runner (la VM),
  # dejando los contenedores de la app levantados.
  # -------------------------------------------------------------------------
  deploy:
    name: Terraform Deploy
    runs-on: [self-hosted, linux, x64, virtualbox]
    needs: [test, sonarqube, sbom]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Download Terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
