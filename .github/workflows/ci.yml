name: CI Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # -------------------------------------------------------------------------
  # BUILD: instala dependencias, lintea y construye las imágenes Docker.
  # -------------------------------------------------------------------------
  build:
    name: Build en ${{ matrix.runner_name }}
    strategy:
      fail-fast: false
      matrix:
        # Definimos cada entorno con su configuración de etiquetas exacta
        include:
          - runner_name: "GitHub Cloud"
            labels: ubuntu-latest
          - runner_name: "VM Local Jose"
            labels: self-hosted-jose
        
    runs-on: ${{ matrix.labels }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gestion-usuarios-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gestion-usuarios-frontend:${{ github.sha }}

  # -------------------------------------------------------------------------
  # TEST: corre la suite de tests con cobertura y análisis de vulnerabilidades
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm test

      - name: Security scan with Snyk
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=backend/package.json --severity-threshold=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  # -------------------------------------------------------------------------
  # SONARQUBE: análisis estático de calidad y seguridad de código.
  # -------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # -------------------------------------------------------------------------
  # SBOM: genera el listado de dependencias en formato CycloneDX
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json

  # -------------------------------------------------------------------------
  # DEPLOY: Corre en tus dos infraestructuras locales con sus etiquetas exactas
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy en ${{ matrix.env_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mapeo exacto de los múltiples tags requeridos para la máquina vieja
          - env_name: "Máquina Vieja (VirtualBox)"
            labels: [self-hosted, Linux, ARM64, x64, virtualbox]
          # Mapeo de la etiqueta simple de tu nueva máquina virtual
          - env_name: "Nueva VM (Jose)"
            labels: [self-hosted-jose]
        
    runs-on: ${{ matrix.labels }}
    needs: [test, sonarqube, sbom]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Pull latest code
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
        run: |
          DEPLOY_DIR="$HOME/pin-app-deploy"
          mkdir -p "$DEPLOY_DIR"
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git -C "$DEPLOY_DIR" init
            git -C "$DEPLOY_DIR" remote add origin "$REPO_URL"
          fi
          git -C "$DEPLOY_DIR" fetch origin "${{ github.ref_name }}"
          git -C "$DEPLOY_DIR" checkout -f -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Deploy with Docker Compose
        working-directory: ${{ env.DEPLOY_DIR }}
        run: docker compose up -d --force-recreate
