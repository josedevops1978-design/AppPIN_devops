name: CI Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # -------------------------------------------------------------------------
  # BUILD: instala dependencias, lintea y construye las imagenes Docker.
  # -------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: gestion-usuarios-backend:${{ github.sha }}

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: gestion-usuarios-frontend:${{ github.sha }}

  # -------------------------------------------------------------------------
  # TEST: corre la suite de tests con cobertura y el analisis de
  # vulnerabilidades de dependencias.
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests with coverage
        working-directory: backend
        run: npm test

      - name: Security scan with Snyk
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=backend/package.json --severity-threshold=high

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage

  # -------------------------------------------------------------------------
  # SONARQUBE: analisis estatico de calidad y seguridad de codigo.
  # -------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: backend/coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # -------------------------------------------------------------------------
  # SBOM: genera el listado de dependencias (Software Bill of Materials)
  # del backend y del frontend en formato CycloneDX.
  # -------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: cyclonedx-json
          output-file: sbom-backend.cdx.json

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: cyclonedx-json
          output-file: sbom-frontend.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-backend.cdx.json
            sbom-frontend.cdx.json

  # -------------------------------------------------------------------------
  # DEPLOY: hace git pull de una carpeta persistente en el runner (la VM) y
  # levanta los contenedores con Docker Compose desde ahi.
  # -------------------------------------------------------------------------
  deploy:
    name: Docker Compose Deploy
    runs-on: [self-hosted, linux, x64, virtualbox]
    needs: [test, sonarqube, sbom]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Pull latest code
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          DEPLOY_DIR="$HOME/pin-app-deploy"
          if [ -d "$DEPLOY_DIR/.git" ]; then
            git -C "$DEPLOY_DIR" fetch origin "${{ github.ref_name }}"
            git -C "$DEPLOY_DIR" reset --hard "origin/${{ github.ref_name }}"
          else
            git clone --branch "${{ github.ref_name }}" "$REPO_URL" "$DEPLOY_DIR"
          fi
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Deploy with Docker Compose
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          PORT: 3000
          DB_HOST: mysql
          DB_PORT: 3306
          DB_USER: ${{ secrets.MYSQL_USER }}
          DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DB_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: docker compose up -d --force-recreate
