<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<span class="navbar-brand">

Gestión Usuarios

</span>

<div>

<span
class="text-white me-3"
id="userName">

</span>

<button
id="logoutBtn"
class="btn btn-danger">

Cerrar sesión

</button>

</div>

</div>

</nav>

<div class="container mt-4">

<div
class="d-flex
justify-content-between
align-items-center
mb-4">

<h2>

Usuarios

</h2>

<button
class="btn btn-success"
id="newUser">

Nuevo Usuario

</button>

</div>

<table
class="table
table-striped
table-hover">

<thead
class="table-dark">

<tr>

<th>ID</th>

<th>Nombre</th>

<th>Apellido</th>

<th>Email</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="usersTable">

</tbody>

</table>

</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/users.js"></script>
<script src="../js/dashboard.js"></script>

</body>

</html>
