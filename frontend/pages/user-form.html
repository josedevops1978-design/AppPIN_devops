<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Nuevo Usuario</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2
class="mb-4"
id="formTitle">

Nuevo Usuario

</h2>

<form id="userForm">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Nombre</label>

<input
id="nombre"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Apellido</label>

<input
id="apellido"
class="form-control"
required>

</div>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Contraseña</label>

<input
type="password"
id="password"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Provincia</label>

<input
id="provincia"
class="form-control">

</div>

<div class="mb-3">

<label>Nivel Educación</label>

<input
id="nivel_educacion"
class="form-control">

</div>

<div class="mb-3">

<label>Sexo</label>

<select
id="sexo"
class="form-select">

<option>Masculino</option>

<option>Femenino</option>

</select>

</div>

<div class="mb-3">

<label>Fecha Nacimiento</label>

<input
type="date"
id="fecha_nacimiento"
class="form-control">

</div>

<div class="mb-3">

<label>Dirección</label>

<input
id="direccion"
class="form-control">

</div>

<div class="mb-3">

<label>Teléfono</label>

<input
id="telefono"
class="form-control">

</div>

<button
class="btn btn-success"
type="submit">

Guardar

</button>

<a
href="dashboard.html"
class="btn btn-secondary">

Cancelar

</a>

</form>

</div>

<script src="../js/api.js"></script>
<script src="../js/userForm.js"></script>

</body>

</html>
